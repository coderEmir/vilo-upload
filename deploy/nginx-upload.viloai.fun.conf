server {
    listen 80;
    listen [::]:80;
    server_name upload.viloai.fun;

    root /var/www/vilo-upload;
    index index.html;
    client_max_body_size 500M;

    # 管理页面。生产环境建议额外启用 Basic Auth 或限制办公 IP。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 前端使用同源相对地址 /template-api，转发到独立模板服务。
    location /template-api/ {
        proxy_pass http://127.0.0.1:3010/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /template-health {
        proxy_pass http://127.0.0.1:3010/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
